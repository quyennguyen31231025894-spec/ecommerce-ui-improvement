<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bài 7</title>
  <style>
    body {
      font-family: Arial;
      font-size: 20px;
    }
    #wrapper {
      width: 300px;
      border: 3px solid black;
      box-shadow: -20px 20px 30px gray;
    }
    header, nav, main, footer {
      border: 3px solid black;
      margin: 5px;
      padding: 5px;
    }
    nav {
      float: left;
      width: 50px;
      height: 250px;
    }
    main {
      float: left;
      width: 198px;
      height: 250px;
    }
    footer {
      clear: both;
    }
  </style>
</head>
<body>
  wrapper
  <div id="wrapper">
    <header>header</header>
    <nav>nav</nav>
    <main>main</main>
    <footer>footer</footer>
  </div>
</body>
</html>
